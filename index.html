<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Mohamed Boulouiz — Full-Stack & Flutter Developer | Digital Designer</title>
    <meta name="description" content="Personal portfolio of Mohamed Boulouiz: Full-Stack Web Developer, Flutter Mobile Engineer, and Digital Product Designer based in Taza, Morocco." />
    <meta name="color-scheme" content="light dark" />
    <!-- FOUC prevention script adhering to modern web guidance -->
    <script>
      try {
        const stored = localStorage.getItem("color-scheme") || localStorage.getItem("theme");
        const isDark = stored ? stored === "dark" : true;
        document.querySelector('meta[name="color-scheme"]').content = isDark ? "dark" : "light";
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
    <!-- Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
